# Optional nicer entrypoint. The NodePort on frontend-service is enough on its
# own; this Ingress just gives a hostname.
#
# Enable once:   minikube addons enable ingress
# Reach it with: minikube tunnel   (then http://blue-green.local)
#   and add to /etc/hosts:  127.0.0.1  blue-green.local
# or:            echo "$(minikube ip)  blue-green.local" | sudo tee -a /etc/hosts
#
# All traffic (including /api/*, which the frontend proxies onward to the
# backend) goes to the single switchable frontend-service.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: blue-green
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: blue-green.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80
